[package]
name = "toolgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Harness-side guardrails: capped file reads, exact edits with diffs, and bounded shell commands"
license = "Apache-2.0"

[lib]
name = "toolgate"
path = "src/lib.rs"

[[bin]]
name = "toolgate"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server", "jev"]
server = [
    "dep:rmcp",
    "dep:clap",
    "dep:anyhow",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/io-util",
    "tokio/macros",
]
jev = [
    "dep:reqwest",
    "dep:tokio",
    "tokio/rt",
    "tokio/macros",
    "tokio/net",
    "tokio/io-util",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
rmcp = { version = "2.2.0", features = ["server", "transport-io", "transport-streamable-http-server", "schemars"], optional = true }
tokio = { version = "1", features = ["macros"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
