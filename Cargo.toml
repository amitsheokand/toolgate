[package]
name = "toolgate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Harness-side guardrails: capped file reads (more gates to follow)"
license = "Apache-2.0"

[lib]
name = "toolgate"
path = "src/lib.rs"

[[bin]]
name = "toolgate"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server", "jev"]
server = ["dep:rmcp", "dep:clap", "dep:anyhow", "tokio/rt-multi-thread", "tokio/net", "tokio/io-util", "tokio/macros"]
jev = ["dep:reqwest", "tokio/rt", "tokio/macros", "tokio/net", "tokio/io-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = { version = "1", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
rmcp = { version = "2.2.0", features = ["server", "transport-io", "transport-streamable-http-server", "schemars"], optional = true }
tokio = { version = "1", features = ["macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
